.pl{display:flex;align-items:center;gap:14px}.bw{flex:1}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
#bar{height:100%;width:0;background:var(--ac)}
#info{font-size:13px;color:var(--mut);margin-top:6px}

#cover{display:block;margin:8px auto;width:110px;height:110px;border-radius:10px}
.st{display:flex;justify-content:space-around;text-align:center;font-size:13px;color:var(--mut)}

'20s':["The Weeknd=Take My Breath/Out of Time/Die For You/Popular","Ariana Grande=positions/34+35/we can't be friends (wait for your love)/yes, and?","Lizzo=About Damn Time","Lil Nas X=MONTERO (Call Me By Your Name)/INDUSTRY BABY","Jack Harlow=First Class/Lovin on Me","Morgan Wallen=Last Night/Cowgirls/Thinkin' Bout Me","Zach Bryan=Something in the Orange/I Remember Everything","Noah Kahan=Stick Season/Dial Drunk","Hozier=Too Sweet","Shaboozey=A Bar Song (Tipsy)","Post Malone=I Had Some Help/Chemical","Tommy Richman=MILLION DOLLAR BABY","Glass Animals=Heat Waves","Maneskin=Beggin'","Harry Styles=Golden/Adore You/Matilda","Gracie Abrams=That's So True/I Love You, I'm Sorry","Ice Spice=Munch (Feelin' U)","BTS=Dynamite/Butter/Permission to Dance","BLACKPINK=How You Like That/Pink Venom","NewJeans=Super Shy/Ditto","Charli xcx=360/Von dutch/Apple","Ed Sheeran=Bad Habits/Shivers/Eyes Closed","Coldplay=My Universe/Higher Power","Imagine Dragons=Bones/Enemy","Lewis Capaldi=Forget Me/Wish You The Best/Pointless","Mitski=My Love Mine All Mine","Role Model=Sally, When the Wine Runs Out","Lola Young=Messy","Alex Warren=Ordinary","Teddy Swims=Bad Dreams","Miley Cyrus=Used to Be Young","Cardi B=WAP/Up","Megan Thee Stallion=Savage/Hiss","Latto=Big Energy","Drake=Way 2 Sexy/Jimmy Cooks","Travis Scott=FE!N","Metro Boomin=Like That/Creepin'","Burna Boy=Last Last","Rema=Calm Down","Adele=Easy on Me/Oh My God","Lady Gaga=Abracadabra","Silk Sonic=Leave the Door Open/Smokin Out the Window"]};
for(const k in MORE)RAW[k].push(...MORE[k]);
const T={};for(const k in RAW){T[k]=[];const seen=new Set();RAW[k].forEach(l=>{const i=l.indexOf('='),a=l.slice(0,i);l.slice(i+1).split('/').forEach(t=>{const e=t+'|'+a;if(!seen.has(e)){seen.add(e);T[k].push(e)}})})}
const $=id=>document.getElementById(id);
const lab=s=>s.replace('|',' – ');
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function hash(s){let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h}
let S={days:{},st:{p:0,w:0,s:0,b:0}},ART={};
try{const r=localStorage.getItem('tuneless-real2');if(r)S=JSON.parse(r)}catch(e){}
try{ART=JSON.parse(localStorage.getItem('tl-art')||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem('tuneless-real2',JSON.stringify(S))}catch(e){}};
const d0=new Date(),dayKey=d0.getFullYear()+'-'+(d0.getMonth()+1)+'-'+d0.getDate();
let era='80s',mode='daily',lvl='basic',idx=0,meta=null,att=[],done=false,won=false,aud=null,tm,sugT,loadId=0,err='';
const N=()=>LV[lvl].length,secs=()=>done?30:LV[lvl][Math.min(att.length,N()-1)],dk=()=>dayKey+era+lvl;

async function api(url){
  try{const r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status);return await r.json()}
  catch(e1){
    return new Promise((res,rej)=>{
      const cb='itcb'+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement('script');
      const clean=()=>{clearTimeout(to);delete window[cb];s.remove()};
      const to=setTimeout(()=>{clean();rej(new Error('timed out; first try: '+e1.message))},8000);
      window[cb]=d=>{clean();res(d)};
      s.onerror=()=>{clean();rej(new Error('request blocked; first try: '+e1.message))};
      s.src=url+'&callback='+cb;document.head.appendChild(s);
    });
  }
}
async function lookup(entry){
  const [t,a]=entry.split('|');
  const j=await api('https://itunes.apple.com/search?media=music&entity=song&limit=10&term='+encodeURIComponent(t+' '+a)),nt=norm(t),na=norm(a);
  const ok=(j.results||[]).filter(x=>x.previewUrl&&norm(x.trackName).includes(nt)&&!/karaoke|tribute|made famous|cover/i.test(x.trackName+x.collectionName));
  return ok.find(x=>norm(x.artistName).includes(na))||null;
}
const artistDone=new Set();
async function fetchArt(artist){
  if(artistDone.has(artist))return;artistDone.add(artist);
  try{
    const j=await api('https://itunes.apple.com/search?media=music&entity=song&limit=150&attribute=artistTerm&term='+encodeURIComponent(artist)),na=norm(artist);
    for(const x of j.results||[]){
      if(!norm(x.artistName).includes(na)||/karaoke|tribute|live/i.test(x.trackName+x.collectionName))continue;
      for(const k in T)for(const e of T[k]){const [t,a]=e.split('|');if(a===artist&&!ART[e]&&norm(x.trackName).includes(norm(t)))ART[e]=x.artworkUrl100}
    }
    try{localStorage.setItem('tl-art',JSON.stringify(ART))}catch(e){}
  }catch(e){artistDone.delete(artist)}
}
function restore(){
  const sv=S.days[dk()];
  if(mode==='daily'&&sv&&sv.idx===idx&&sv.att.length<=N()){att=sv.att;done=sv.done;won=sv.won}else{att=[];done=false;won=false}
}
async function loadSong(){
  const id=++loadId;stopA();meta=null;err='';render();
  const L=T[era],start=mode==='daily'?hash(dayKey+era)%L.length:Math.floor(Math.random()*L.length);
  try{
    for(let i=0;i<L.length;i++){
      const k=(start+i)%L.length,m=await lookup(L[k]);
      if(id!==loadId)return;
      if(m){idx=k;meta=m;break}
    }
  }catch(e){if(id!==loadId)return;err='Could not reach the iTunes API ('+e.message+'). Open this file from your computer (not inside Claude), and try disabling ad blockers or VPNs.'}
  if(id!==loadId)return;
  if(meta){aud=new Audio();aud.setAttribute('playsinline','');aud.setAttribute('webkit-playsinline','');aud.preload='auto';aud.src=meta.previewUrl.replace(/^http:/,'https:');aud.load();ART[T[era][idx]]=meta.artworkUrl100}
  else if(!err)err='No previews found for this era.';
  restore();$('q').value='';$('sug').innerHTML='';render();
}
function stopA(){clearTimeout(tm);if(aud)aud.pause();const b=$('bar');b.style.transition='none';b.style.width='0';$('play').textContent='▶'}
function play(){
  if(!aud)return;stopA();try{aud.currentTime=done?0:START}catch(e){}
  aud.play().then(()=>{
    const s=secs(),b=$('bar');b.style.transition='none';b.style.width='0';void b.offsetWidth;
    b.style.transition='width '+s+'s linear';b.style.width='100%';$('play').textContent='■';
    tm=setTimeout(stopA,s*1000);
  }).catch(()=>{err='Playback was blocked. Click play again.';render()});
}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:99';
  c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);const g=c.getContext('2d');
  const cols=['#ff4d6d','#ffd93d','#3ddc84','#4dabf7','#b197fc','#ff922b'],t0=performance.now();
  const P=Array.from({length:180},(_,i)=>({x:innerWidth*(i%2?.25:.75),y:innerHeight*.5,vx:(Math.random()-.5)*18,vy:-Math.random()*16-4,w:6+Math.random()*6,h:4+Math.random()*5,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.floor(Math.random()*cols.length)]}));
  (function f(t){const el=t-t0;g.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;g.save();g.globalAlpha=Math.max(0,1-el/3500);g.translate(p.x,p.y);g.rotate(p.r);g.fillStyle=p.c;g.fillRect(-p.w/2,-p.h/2,p.w,p.h);g.restore()});
    if(el<3500)requestAnimationFrame(f);else c.remove()})(t0);
}
function finish(w){done=true;won=w;
  if(mode==='daily'){const s=S.st;s.p++;if(w){s.w++;s.s++;s.b=Math.max(s.b,s.s)}else s.s=0;S.days[dk()]={att,done,won,idx};save()}
  render();play();if(w)confetti()}
function persist(){if(mode==='daily'&&!done){S.days[dk()]={att,done:false,won:false,idx};save()}}
function render(){
  document.body.className=lvl==='hard'?'hard':'';$('sub').textContent='Real songs. Name it in '+N()+' tries – every miss unlocks more audio.';
  $('eras').innerHTML='';
  E.forEach(e=>{const b=document.createElement('button');b.className='era'+(e[0]===era?' on':'');b.textContent=e[1];
    b.onclick=()=>{if(e[0]!==era){era=e[0];loadSong()}};$('eras').appendChild(b)});
  $('mDaily').className=mode==='daily'?'on':'';$('mPrac').className=mode==='prac'?'on':'';
  $('lBasic').className=lvl==='basic'?'on':'';$('lHard').className=lvl==='hard'?'on':'';
  const A=$('att');A.innerHTML='';
  for(let i=0;i<N();i++){const a=document.createElement('div'),x=att[i];
    a.className='a'+(x?(x.t==='w'?' w':x.t==='x'?' x':' s'):(i===att.length&&!done?' cur':''));
    a.textContent=x?(x.t==='s'?'Skipped':(x.t==='w'?'✓ ':'✗ ')+x.g):(i+1);A.appendChild(a)}
  $('play').disabled=!meta;
  $('info').textContent=err?err:!meta?'Loading song…':done?'Full 30s preview':'Clip '+Math.min(att.length+1,N())+'/'+N()+' · '+secs()+'s of audio';
  $('ctl').style.display=done||!meta?'none':'block';
  $('after').style.display=(done||mode==='prac'||err)&&(meta||err)?'flex':'none';
  $('next').style.display=mode==='prac'||err?'':'none';
  $('share').style.display=done?'':'none';
  $('res').textContent=done?(won?'🎉 Got it in '+att.length+'! ':'It was ')+lab(T[era][idx]):'';
  $('res').style.color=done&&won?'var(--ok)':'var(--ink)';
  $('cover').style.display=done&&meta?'block':'none';if(done&&meta)$('cover').src=meta.artworkUrl100.replace('100x100','300x300');
  const s=S.st;$('stats').innerHTML=[['Played',s.p],['Win %',s.p?Math.round(100*s.w/s.p):0],['Streak',s.s],['Best',s.b]].map(x=>'<div><b>'+x[1]+'</b>'+x[0]+'</div>').join('');
}
const setTh=th=>{const u=ART[th.dataset.k];th.style.backgroundImage=u?'url('+u+')':'';th.textContent=u?'':'🎵'};
function showSug(){
  const v=$('q').value.trim().toLowerCase(),box=$('sug');box.innerHTML='';clearTimeout(sugT);if(!v)return;
  const hits=T[era].filter(s=>lab(s).toLowerCase().includes(v)).slice(0,6);
  hits.forEach(s=>{
    const b=document.createElement('button'),th=document.createElement('span'),tx=document.createElement('span');
    b.className='sg';th.className='th';th.dataset.k=s;setTh(th);tx.textContent=lab(s);b.append(th,tx);
    b.onclick=()=>{$('q').value=lab(s);box.innerHTML=''};box.appendChild(b)});
  sugT=setTimeout(()=>{
    const need=[...new Set(hits.filter(s=>!ART[s]).map(s=>s.split('|')[1]))].filter(a=>!artistDone.has(a));
    Promise.all(need.map(fetchArt)).then(()=>box.querySelectorAll('.th').forEach(setTh));
  },350);
}
$('q').oninput=showSug;
$('play').onclick=()=>$('play').textContent==='■'?stopA():play();
$('skip').onclick=()=>{if(done)return;stopA();att.push({t:'s'});if(att.length>=N())finish(false);else persist();render()};
$('guess').onclick=()=>{
  if(done)return;const v=$('q').value.trim().toLowerCase(),k=T[era].findIndex(s=>lab(s).toLowerCase()===v);
  if(k<0){$('res').textContent='Pick a song from the suggestions.';$('res').style.color='var(--bad)';return}
  stopA();
  if(k===idx){att.push({t:'w',g:lab(T[era][k])});finish(true)}
  else{att.push({t:'x',g:lab(T[era][k])});if(att.length>=N())finish(false);else persist()}
  $('q').value='';$('sug').innerHTML='';render();
};
$('mDaily').onclick=()=>{mode='daily';loadSong()};
$('mPrac').onclick=()=>{mode='prac';loadSong()};
$('lBasic').onclick=()=>{if(lvl==='basic')return;stopA();lvl='basic';restore();render()};
$('lHard').onclick=()=>{if(lvl==='hard')return;stopA();lvl='hard';restore();render()};
$('next').onclick=()=>loadSong();
$('share').onclick=()=>{
  const sq=Array.from({length:N()},(_,i)=>att[i]?(att[i].t==='w'?'🟩':att[i].t==='x'?'🟥':'⬛'):'⬜').join('');
  const txt='Tuneless '+(mode==='daily'?dayKey:'practice')+' · '+E.find(e=>e[0]===era)[1]+' · '+lvl+'\n'+sq;
  try{navigator.clipboard.writeText(txt).then(()=>{$('share').textContent='Copied!'},()=>{$('res').textContent=txt})}catch(e){$('res').textContent=txt}
};
loadSong();
</script>
